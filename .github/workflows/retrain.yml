name: Retrain LightGBM profiles

on:
  schedule:
    # 매일 새벽 3시 10분 (KST) = 전날 18:10 UTC
    - cron: "10 18 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r model/requirements.txt

      - name: Run training script
        run: python model/train.py
        env:
          DATA_DIR: data
          OUT_DIR: frontend/data

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/graph.json
          git diff --cached --quiet || git commit -m "chore: retrain LightGBM profiles ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
